name: macOS build

# Builds unsigned, ad-hoc-signed .app bundles for both Mac architectures
# without owning a Mac. Trigger manually, or push a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build (${{ matrix.arch }})
    # macos-14 is Apple Silicon; the Intel slice is cross-compiled on it,
    # because GitHub's Intel runners (macos-13) are being retired.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            rust_target: aarch64-apple-darwin
            native: true
          - arch: x86_64
            rust_target: x86_64-apple-darwin
            native: false
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.rust_target }}
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build .app
        run: |
          if [ "${{ matrix.native }}" = "true" ]; then
            cargo tauri build --bundles app
          else
            cargo tauri build --bundles app --target ${{ matrix.rust_target }}
          fi

      - name: Ad-hoc sign
        run: |
          if [ "${{ matrix.native }}" = "true" ]; then
            APP="src-tauri/target/release/bundle/macos/Trio.app"
          else
            APP="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Trio.app"
          fi
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          mkdir -p dist
          ZIP="dist/Trio-${VERSION}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Trio-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

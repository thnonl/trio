name: macOS build

# Builds an unsigned, ad-hoc-signed .app for both Mac architectures without a Mac.
# Trigger manually, or on a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            arch: aarch64
          - runner: macos-13 # Intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build .app
        run: cargo tauri build --bundles app

      - name: Ad-hoc sign
        run: |
          APP="src-tauri/target/release/bundle/macos/Trio.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          mkdir -p dist
          ZIP="dist/Trio-${VERSION}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent "src-tauri/target/release/bundle/macos/Trio.app" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Trio-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

name: macOS build

# Builds an unsigned, ad-hoc-signed .app for Apple Silicon, without owning a Mac.
# Trigger manually, or push a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-arm64-cargo-

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build .app
        run: cargo tauri build --bundles app

      - name: Ad-hoc sign
        run: |
          APP="src-tauri/target/release/bundle/macos/Trio.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          mkdir -p dist
          ZIP="dist/Trio-${VERSION}-macos-arm64.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Trio-macos-arm64
          path: dist/*
          if-no-files-found: error
